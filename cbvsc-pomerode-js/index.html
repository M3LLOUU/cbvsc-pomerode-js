<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBVSC Pomerode — Gestão de Escalas e Viaturas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="toast"></div>

    <!-- Tela 1: Login -->
    <div id="login-root"></div>

    <!-- Aplicação Principal Autenticada -->
    <div id="app-container" style="display:none;">
        <div class="topbar-mobile">
            <strong>CBVSC Pomerode</strong>
            <button type="button" onclick="CBV.App.toggleMenu()">☰ Menu</button>
        </div>

        <nav id="sidebar">
            <div class="logo-area">
                <h2>CBVSC Pomerode</h2>
                <small>Plantão 24h • Tempo Real</small>
            </div>
            <ul id="menu-list" class="menu-items"></ul>
            <div class="user-info">
                <div><strong id="info-nome"></strong></div>
                <div id="info-perfil" class="meta-light"></div>
                <div id="info-faltas" class="meta-light"></div>
                <button type="button" class="btn-logout" onclick="CBV.App.logout()">Sair</button>
            </div>
        </nav>

        <main id="screen-root"></main>
    </div>

    <!-- Configuração e Camada de Dados / Regras de Negócio -->
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>

    <!-- Telas Separadas por Módulo Funcional -->
    <script src="js/telas/telaLogin.js"></script>
    <script src="js/telas/telaEscala.js"></script>
    <script src="js/telas/telaAgendamento.js"></script>
    <script src="js/telas/telaViaturas.js"></script>
    <script src="js/telas/telaOperacional.js"></script>
    <script src="js/telas/telaBombeiros.js"></script>
    <script src="js/telas/telaAuditoria.js"></script>

    <!-- Orquestrador da Aplicação -->
    <script src="js/app.js"></script>
</body>
</html>
